<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 222" role="img" aria-labelledby="title desc">
  <title id="title">Macro recall on held-out surfaces</title>
  <desc id="desc">The SENS3 pilot measured 38.3 percent macro recall with force alone and 95.1 percent with force plus thermal cues.</desc>
  <rect width="480" height="222" fill="white"/>
  <path d="M158 45v125m138-125v125m138-125v125" fill="none" stroke="#d4d9dd"/>
  <path d="M158 170h276" fill="none" stroke="#69727a"/>
  <rect x="158" y="51" width="105.708" height="32" fill="#9ba8b3"/>
  <rect x="158" y="111" width="262.476" height="32" fill="#31648e"/>
  <g font-family="Arial, sans-serif" font-size="21" fill="#252a2e">
    <text x="146" y="74" font-size="19" text-anchor="end">Force only</text>
    <text x="146" y="134" font-size="19" text-anchor="end">Force + thermal</text>
    <text x="273" y="74">38.3%</text>
    <text x="411" y="134" text-anchor="end" fill="white">95.1%</text>
    <text x="158" y="193" text-anchor="middle">0</text>
    <text x="296" y="193" text-anchor="middle">50</text>
    <text x="434" y="193" text-anchor="middle">100</text>
    <text x="296" y="218" text-anchor="middle">Macro recall (%)</text>
  </g>
</svg>
