<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-labelledby="title desc">
  <title id="title">Material recognition on held-out surfaces</title>
  <desc id="desc">On the SENS3 pilot, macro recall was 38.3 percent with force alone and 95.1 percent with force plus thermal signals.</desc>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #20242b; }
    .label { font-size: 20px; }
    .value { font-size: 21px; font-weight: 600; }
    .axis { font-size: 16px; fill: #555e68; }
  </style>
  <path d="M183 24V154 M249 24V154 M315 24V154 M381 24V154 M447 24V154" fill="none" stroke="#e9ebee" stroke-width="1.25"/>
  <path d="M183 55H284.112" fill="none" stroke="#929ca5" stroke-width="2.5"/>
  <path d="M183 116H434.064" fill="none" stroke="#1a5c67" stroke-width="2.5"/>
  <circle cx="284.112" cy="55" r="6" fill="#fff" stroke="#606d78" stroke-width="2.5"/>
  <circle cx="434.064" cy="116" r="6.5" fill="#1a5c67"/>
  <text class="label" x="166" y="55" dy=".34em" text-anchor="end">Force only</text>
  <text class="label" x="166" y="116" dy=".34em" text-anchor="end">Force + thermal</text>
  <text class="value" x="284.112" y="37" text-anchor="middle">38.3</text>
  <text class="value" x="434.064" y="98" text-anchor="middle">95.1</text>
  <path d="M183 154H447 M183 154v5 M249 154v5 M315 154v5 M381 154v5 M447 154v5" fill="none" stroke="#68717b" stroke-width="1.25"/>
  <g text-anchor="middle">
    <text class="axis" x="183" y="177">0</text>
    <text class="axis" x="249" y="177">25</text>
    <text class="axis" x="315" y="177">50</text>
    <text class="axis" x="381" y="177">75</text>
    <text class="axis" x="447" y="177">100</text>
    <text class="label" x="315" y="203">Macro recall (%)</text>
  </g>
</svg>
